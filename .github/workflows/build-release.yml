name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build universal macOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Run persistence regression tests
        run: bash Tests/run-persistence-tests.sh

      - name: Build and package DMG and ZIP
        run: bash scripts/build-release.sh

      - name: Save release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-${{ github.sha }}
          path: .build/dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: Publish GitHub release
    if: github.repository == 'arthur-c/dns-easy-switcher' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release-${{ github.sha }}
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          asset_name="DNS-Easy-Switcher-$release_version-universal-macos"
          (
            cd dist
            sha256sum --check SHA256SUMS
          )
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/release-is-draft; then
            if [[ "$(cat /tmp/release-is-draft)" == false ]]; then
              gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/release-assets
              for asset in "$asset_name.dmg" "$asset_name.zip" SHA256SUMS; do
                grep -Fxq "$asset" /tmp/release-assets
              done
              echo "Release $RELEASE_TAG is already published with all expected assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "DNS Easy Switcher $release_version" \
              --notes-file dist/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/$asset_name.dmg" "dist/$asset_name.zip" dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
